        </h1>

        <p class="mt-4 text-gray-500 text-lg max-w-md">
          Access bookings, manage care services, and stay connected with caregivers anytime.
        </p>

      <!-- Image -->
      <div class="hidden lg:block">
        <img src="login.png" class="rounded-2xl shadow-lg w-full max-w-md" />
      </div>

    </section>

    <!-- RIGHT SIDE -->
    <section class="flex justify-center">

      <div class="w-full max-w-md bg-white border border-gray-100 shadow-sm rounded-2xl p-8">

        <h2 class="text-3xl font-bold text-gray-900">Log In</h2>
        <p class="text-gray-500 mt-2 mb-8">Welcome back! Please login to continue</p>

        <!-- FORM -->
        <form class="space-y-5" (ngSubmit)="submit()">

          <!-- Email -->
          <div>
            <label class="text-sm font-semibold text-gray-700">Phone / Email</label>
            <div class="relative mt-2">
              <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
              <input
                type="text" name="identifier" [(ngModel)]="identifier" required
                placeholder="Enter email or phone"
                class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-carego-teal focus:border-carego-teal outline-none"
              />
            </div>
          </div>

          <!-- Password -->
          <div>
            <label class="text-sm font-semibold text-gray-700">Password</label>
            <div class="relative mt-2">
              <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>

              <input
                [type]="showPassword() ? 'text' : 'password'" name="password" [(ngModel)]="password" required
                placeholder="Enter password"
                class="w-full pl-11 pr-11 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-carego-teal focus:border-carego-teal outline-none"
              />

              <button type="button" (click)="showPassword.set(!showPassword())" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400">
                <i class="fa-solid" [class.fa-eye]="!showPassword()" [class.fa-eye-slash]="showPassword()"></i>
              </button>
            </div>
          </div>

          <!-- Remember + Forgot -->
          <div class="flex justify-between items-center text-sm">
            <label class="flex items-center gap-2 text-gray-600">
              <input type="checkbox" name="remember" [(ngModel)]="remember" class="w-4 h-4 text-carego-teal border-gray-300 focus:ring-carego-teal">
              Remember me
            </label>

            <a class="cursor-pointer text-carego-teal font-semibold hover:underline">
              Forgot password?
            </a>
          </div>

          <!-- Button -->
          @if (error()) { <p class="text-sm text-red-500">{{ error() }}</p> }
          <button type="submit"
            class="w-full bg-carego-teal text-white py-3 rounded-xl font-bold hover:opacity-90 transition"
          >
              Log In
          </button>

        </form>

        <!-- Divider -->
        <div class="my-6 flex items-center gap-4">
          <div class="flex-1 h-px bg-gray-100"></div>
          <span class="text-xs text-gray-400">OR</span>
          <div class="flex-1 h-px bg-gray-100"></div>
        </div>

        <!-- Social -->
        <div class="grid grid-cols-3 gap-3">
          <button type="button" (click)="social()" class="border rounded-xl py-2 text-sm hover:bg-gray-50"> <i class="fab fa-google text-red-500"></i> Google</button>
          <button type="button" (click)="social()" class="border rounded-xl py-2 text-sm hover:bg-gray-50"> <i class="fab fa-facebook text-blue-600"></i> Facebook</button>
          <button type="button" (click)="social()" class="border rounded-xl py-2 text-sm hover:bg-gray-50"> <i class="fab fa-apple text-gray-800"></i> Apple</button>
        </div>

        <p class="text-center text-sm text-gray-500 mt-6">
          Don’t have an account?
          <a routerLink="/auth/register" class="text-carego-teal font-bold hover:underline">Sign up</a>
        </p>

      </div>

    </section>

  </div>
</main>
