<aside class="w-64 bg-white border-r border-border-light flex flex-col fixed h-full z-10" data-purpose="sidebar">
  <div class="p-6">
    <div class="flex items-center gap-2 mb-10">
      <a routerLink="/"><img src="assets/cg-logo.png" width="140" alt="CareGo+" /></a>
    </div>
    <nav class="space-y-1">
      @for (l of links; track l.path) {
        <a class="flex items-center gap-3 p-3 text-gray-600 hover:bg-gray-50 rounded-lg" [routerLink]="l.path"
           routerLinkActive="sidebar-item-active font-medium !rounded-r-none !text-emerald-600 !bg-emerald-50">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path [attr.d]="l.icon" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
          {{ l.label }}
        </a>
      }
    </nav>
  </div>
  <div class="mt-auto p-4 border-t border-border-light bg-gray-50 space-y-3" data-purpose="user-footer">
    @if (auth.canSwitchTo('caregiver')) {
      <button type="button" (click)="auth.switchRole('caregiver')" class="w-full text-[11px] font-bold tracking-wide border border-emerald-600 text-emerald-700 rounded-lg py-2 hover:bg-emerald-50">SWITCH TO CAREGIVER</button>
    }
    <div class="flex items-center gap-3">
      <app-avatar class="w-10 h-10" [photo]="auth.account()?.photo" [name]="auth.account()?.name ?? ''" />
      <div class="flex-1 min-w-0">
        <p class="text-sm font-semibold text-gray-900 truncate">{{ auth.account()?.name }}</p>
        <a class="text-xs text-gray-500 hover:underline" routerLink="/app/profile">View Profile</a>
      </div>
      <button type="button" (click)="auth.logout()" class="text-gray-400 hover:text-gray-600" title="Sign out" aria-label="Sign out">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </div>
  </div>
</aside>
<router-outlet />
