<aside class="w-64 bg-[#0F2F26] text-emerald-50 flex flex-col fixed h-full z-10">
  <div class="p-6">
    <a routerLink="/"><img src="assets/cg-logo-w.png" width="140" alt="CareGo+" /></a>
    <p class="mt-2 text-[10px] font-bold tracking-widest text-emerald-300/80">ADMIN CONSOLE</p>
  </div>
  <nav class="px-3 space-y-1 flex-1">
    @for (l of links; track l.path) {
      <a [routerLink]="l.path" routerLinkActive="bg-white/10 text-white" [routerLinkActiveOptions]="{ exact: l.exact }"
         class="flex items-center gap-3 px-4 py-3 rounded-lg text-emerald-100/80 hover:bg-white/5 text-sm font-medium">
        <i class="fa-solid w-5 text-center" [class]="'fa-solid w-5 text-center ' + l.icon"></i>
        <span class="flex-1">{{ l.label }}</span>
        @if (l.badge() > 0) {
          <span class="text-[10px] font-bold bg-orange-500 text-white rounded-full min-w-5 h-5 px-1.5 inline-flex items-center justify-center">{{ l.badge() }}</span>
        }
      </a>
    }
  </nav>
  <div class="p-4 border-t border-white/10 flex items-center gap-3">
    <app-avatar class="w-10 h-10 !bg-emerald-800 !text-emerald-100" [photo]="auth.account()?.photo" [name]="auth.account()?.name ?? ''" />
    <div class="flex-1 min-w-0">
      <p class="text-sm font-semibold truncate">{{ auth.account()?.name }}</p>
      <p class="text-[11px] text-emerald-200/70">Administrator</p>
    </div>
    <button type="button" (click)="auth.logout()" class="text-emerald-200/70 hover:text-white" title="Sign out"><i class="fa-solid fa-right-from-bracket"></i></button>
  </div>
</aside>
<main class="ml-64 min-h-screen bg-slate-50 text-slate-800">
  <router-outlet />
</main>
