<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CareGo+ | Professional Care, Right at Home</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
  <!-- Tailwind CSS v3 CDN (same runtime the prototype used); one merged theme for every page -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    /*
     * One palette for the whole app. Every green (custom aliases and Tailwind's green / emerald / teal)
     * resolves to the brand ramp below, so a "green" button looks the same on every page.
     * BRAND = base action colour (#006B44, the /services colour), DARK = hover, LIGHT = tinted backgrounds.
     */
    const BRAND_RAMP = {
      50: '#E6F3F0', 100: '#CCE1DA', 200: '#99C4B4', 300: '#66A68F', 400: '#338969', 500: '#007A4E',
      600: '#006B44', 700: '#005A39', 800: '#00482E', 900: '#003722', 950: '#00261A'
    };
    const BRAND = BRAND_RAMP[600], DARK = BRAND_RAMP[700], LIGHT = BRAND_RAMP[50];
    const INK = '#1F2937', MUTED = '#6B7280', LINE = '#E5E7EB';
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            'headline-lg': ['Inter', 'sans-serif'], 'headline-md': ['Inter', 'sans-serif'],
            'body-lg': ['Inter', 'sans-serif'], 'body-md': ['Inter', 'sans-serif'],
            'label-caps': ['Inter', 'sans-serif'], 'display-earnings': ['Inter', 'sans-serif']
          },
          colors: {
            green: BRAND_RAMP, emerald: BRAND_RAMP, teal: BRAND_RAMP,
            /* public site / brand */
            brand: {
              teal: BRAND, 'teal-light': LIGHT, 'teal-dark': DARK, orange: '#FF8A00', dark: INK,
              green: BRAND, lightGreen: LIGHT, borderGreen: BRAND_RAMP[100]
            },
            primary: BRAND, 'primary-dark': DARK, secondary: LIGHT, accent: '#FF8A00',
            'accent-dark': '#E67E00', dark: INK,
            primaryLight: LIGHT, primaryDark: DARK, neutralDark: INK, accentPurple: '#714B9D',
            'carego-teal': BRAND, 'carego-light-teal': LIGHT, 'carego-dark': INK,
            'carego-gray': MUTED, 'carego-orange': '#FFA500',
            /* user dashboard */
            'carego-green': BRAND, 'carego-light-green': LIGHT, 'carego-sidebar': '#FFFFFF',
            carego: {
              primary: BRAND, 'primary-dark': DARK, secondary: LIGHT, accent: '#F97316',
              border: LINE, muted: MUTED, bg: '#F9FAFB'
            },
            'mb-green': BRAND,
            'pt-primary': BRAND, 'pt-secondary': LIGHT, 'pt-accent': BRAND,
            'status-pending': '#F59E0B', 'status-confirmed': BRAND, 'status-progress': '#3B82F6',
            'status-completed': BRAND, 'status-cancelled': '#EF4444',
            'border-light': LINE, 'bg-light': '#F9FAFB',
            /* caregiver portal (material token names, prefixed cg-), mapped onto the same palette */
            'cg-inverse-on-surface': '#f0f1f2', 'cg-text-muted': MUTED, 'cg-on-surface-variant': '#4B5563',
            'cg-on-surface': INK, 'cg-surface-container-high': '#e7e8e9', 'cg-surface-container-low': '#F9FAFB',
            'cg-on-tertiary-fixed': '#341100', 'cg-surface-container-highest': '#F3F4F6', 'cg-tertiary-container': '#B45309',
            'cg-primary-fixed-dim': BRAND_RAMP[200], 'cg-on-secondary': '#ffffff', 'cg-error-container': '#FEE2E2',
            'cg-inverse-primary': BRAND_RAMP[200], 'cg-on-primary-fixed-variant': DARK, 'cg-tertiary-fixed': '#FEF3C7',
            'cg-surface-dim': '#d9dadb', 'cg-error': '#DC2626', 'cg-outline': MUTED, 'cg-on-error-container': '#991B1B',
            'cg-surface-card': '#FFFFFF', 'cg-secondary-fixed-dim': BRAND_RAMP[300], 'cg-secondary': BRAND,
            'cg-border-subtle': LINE, 'cg-surface-bright': '#F9FAFB', 'cg-primary-container': BRAND,
            'cg-on-primary': '#ffffff', 'cg-surface-variant': '#F3F4F6', 'cg-on-secondary-fixed-variant': DARK,
            'cg-primary': BRAND, 'cg-primary-fixed': LIGHT, 'cg-on-background': INK,
            'cg-surface-container-lowest': '#ffffff', 'cg-secondary-fixed': BRAND_RAMP[100], 'cg-on-tertiary-container': '#FDE68A',
            'cg-on-primary-fixed': BRAND_RAMP[900], 'cg-inverse-surface': INK, 'cg-secondary-container': LIGHT,
            'cg-on-primary-container': '#ffffff', 'cg-tertiary': '#78350F', 'cg-surface-tint': BRAND,
            'cg-outline-variant': '#D1D5DB', 'cg-on-error': '#ffffff', 'cg-surface-container': '#F3F4F6',
            'cg-tertiary-fixed-dim': '#FCD34D', 'cg-on-secondary-container': BRAND, 'cg-surface': '#F9FAFB',
            'cg-on-secondary-fixed': BRAND_RAMP[900], 'cg-on-tertiary': '#ffffff', 'cg-background': '#F9FAFB',
            'cg-on-tertiary-fixed-variant': '#92400E', 'cg-text-main': INK
          },
          borderRadius: { cg: '0.25rem', cglg: '0.5rem', cgxl: '0.75rem', cgfull: '9999px' },
          spacing: {
            'margin-mobile': '16px', gutter: '24px', 'container-max': '1200px', 'stack-md': '16px',
            'sidebar-width': '256px', 'stack-sm': '8px', 'stack-lg': '32px'
          },
          /* Same scale as the user and admin dashboards: page title 24px, card title 18px, KPI figures 24px. */
          fontSize: {
            'headline-md': ['18px', { lineHeight: '28px', fontWeight: '700' }],
            'label-caps': ['12px', { lineHeight: '16px', letterSpacing: '0.05em', fontWeight: '700' }],
            'body-lg': ['16px', { lineHeight: '24px', fontWeight: '400' }],
            'headline-lg': ['24px', { lineHeight: '32px', fontWeight: '700' }],
            'display-earnings': ['24px', { lineHeight: '32px', letterSpacing: '-0.01em', fontWeight: '700' }],
            'body-md': ['14px', { lineHeight: '20px', fontWeight: '400' }]
          }
        }
      }
    };
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
